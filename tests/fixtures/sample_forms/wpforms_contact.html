<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>WPForms</title></head>
<body>
<h1>お問い合わせ</h1>
<div class="wpforms-container">
<form id="wpforms-form-456" class="wpforms-form" method="post" action="/contact/">
    <div class="wpforms-field wpforms-field-name wpforms-field-required">
        <label class="wpforms-field-label" for="wpforms-456-field_0">お名前 <span class="wpforms-required-label">*</span></label>
        <input type="text" id="wpforms-456-field_0" class="wpforms-field-large" name="wpforms[fields][0]" required>
    </div>
    <div class="wpforms-field wpforms-field-email wpforms-field-required">
        <label class="wpforms-field-label" for="wpforms-456-field_1">メールアドレス <span class="wpforms-required-label">*</span></label>
        <input type="email" id="wpforms-456-field_1" class="wpforms-field-large" name="wpforms[fields][1]" required>
    </div>
    <div class="wpforms-field wpforms-field-phone">
        <label class="wpforms-field-label" for="wpforms-456-field_2">電話番号</label>
        <input type="tel" id="wpforms-456-field_2" class="wpforms-field-large" name="wpforms[fields][2]">
    </div>
    <div class="wpforms-field wpforms-field-textarea wpforms-field-required">
        <label class="wpforms-field-label" for="wpforms-456-field_3">メッセージ <span class="wpforms-required-label">*</span></label>
        <textarea id="wpforms-456-field_3" class="wpforms-field-large" name="wpforms[fields][3]" required></textarea>
    </div>
    <div class="wpforms-submit-container">
        <button type="submit" class="wpforms-submit">送信</button>
    </div>
</form>
</div>
</body>
</html>
