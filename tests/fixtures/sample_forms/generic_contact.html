<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>お問い合わせ</title></head>
<body>
<h1>お問い合わせフォーム</h1>
<form action="/contact/submit" method="POST" id="contact-form">
    <div>
        <label for="name">お名前</label>
        <input type="text" id="name" name="name" placeholder="山田 太郎" required>
    </div>
    <div>
        <label for="email">メールアドレス</label>
        <input type="email" id="email" name="email" placeholder="example@example.com" required>
    </div>
    <div>
        <label for="phone">電話番号</label>
        <input type="tel" id="phone" name="phone" placeholder="03-1234-5678">
    </div>
    <div>
        <label for="company">会社名</label>
        <input type="text" id="company" name="company" placeholder="株式会社サンプル">
    </div>
    <div>
        <label for="subject">お問い合わせ種別</label>
        <select id="subject" name="subject" required>
            <option value="">選択してください</option>
            <option value="general">一般的なお問い合わせ</option>
            <option value="quote">お見積もり</option>
            <option value="support">サポート</option>
        </select>
    </div>
    <div>
        <label for="message">お問い合わせ内容</label>
        <textarea id="message" name="message" placeholder="お問い合わせ内容を入力してください" required></textarea>
    </div>
    <div>
        <input type="checkbox" id="privacy" name="privacy" required>
        <label for="privacy">プライバシーポリシーに同意する</label>
    </div>
    <div>
        <input type="submit" value="送信する">
    </div>
</form>
</body>
</html>
